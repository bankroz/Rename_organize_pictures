name: Build Desktop Preview
on: workflow_dispatch
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-gui.txt -r requirements-tui.txt -r requirements-build.txt
      - name: Install ffprobe
        shell: pwsh
        run: |
          choco install ffmpeg -y --no-progress
          $probe = Get-ChildItem 'C:/ProgramData/chocolatey/lib/ffmpeg/tools' -Filter ffprobe.exe -Recurse | Select-Object -First 1
          if (-not $probe) { throw 'ffprobe binary not found' }
          $probe.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: python -m unittest discover -s tests
      - run: ./scripts/build-desktop.ps1
      - run: ./scripts/package-desktop.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-desktop-preview
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
