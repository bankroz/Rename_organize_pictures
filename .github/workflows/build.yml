name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version label (e.g. v2.7)'
        required: false
        default: 'dev'

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: photo-renamer-windows-x64.zip
            exe_suffix: .exe
            platform_dir: win
          - os: macos-latest
            artifact_name: photo-renamer-macos-arm64.zip
            exe_suffix: ''
            platform_dir: mac
          - os: ubuntu-latest
            artifact_name: photo-renamer-linux-x64.tar.gz
            exe_suffix: ''
            platform_dir: linux

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow piexif

      - name: Install PyInstaller
        run: pip install pyinstaller>=6.0

      - name: Build executable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pyinstaller --onefile --name photo_renamer `
            --add-data "patterns.json;." `
            photo_renamer.py

      - name: Build executable (macOS / Linux)
        if: runner.os != 'Windows'
        run: |
          pyinstaller --onefile --name photo_renamer \
            --add-data "patterns.json:." \
            photo_renamer.py

      - name: Prepare dist folder
        shell: bash
        run: |
          mkdir -p dist_release
          cp patterns.json dist_release/
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp dist/photo_renamer.exe dist_release/
          else
            cp dist/photo_renamer dist_release/
          fi

      # ── Windows: zip ──
      - name: Pack (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist_release\* -DestinationPath ${{ matrix.artifact_name }}

      # ── macOS: zip ──
      - name: Pack (macOS)
        if: runner.os == 'macOS'
        run: |
          cd dist_release && zip -r ../${{ matrix.artifact_name }} .

      # ── Linux: tar.gz ──
      - name: Pack (Linux)
        if: runner.os == 'Linux'
        run: |
          cd dist_release && tar -czf ../${{ matrix.artifact_name }} .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    # Only run when triggered by a tag push
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_artifacts
          merge-multiple: true

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: release_artifacts/*
          generate_release_notes: true
